[package]
name = "arenaskiplist"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
readme = "README.md"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "A fast, lock-free, concurrent arena-backed skip list for Rust"
repository = "https://github.com/surrealdb/arenaskiplist"
homepage = "https://github.com/surrealdb/arenaskiplist"
documentation = "https://docs.rs/arenaskiplist"
keywords = [
    "skiplist",
    "arena",
    "concurrent",
    "lock-free",
    "lsm",
]
categories = ["data-structures", "concurrency", "database-implementations"]

[dependencies]
fastrand = "2.3"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
crossbeam-skiplist = "0.1.3"
artmap = "0.3.1"
imbl = "7.0"

[[bench]]
name = "comparison_bench"
harness = false

[lints.clippy]
allow_attributes = "allow"
assigning_clones = "warn"
bool_assert_comparison = "allow"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
debug_assert_with_mut_call = "warn"
disallowed_methods = "warn"
expl_impl_clone_on_copy = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
fallible_impl_from = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
lossy_float_literal = "warn"
mutex_atomic = "warn"
no_effect_underscore_binding = "warn"
option_as_ref_cloned = "warn"
redundant_clone = "warn"
ref_option_ref = "warn"
semicolon_if_nothing_returned = "warn"
set_contains_or_insert = "warn"
single_char_pattern = "warn"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_to_owned = "warn"
unwrap_used = "allow"
unused_self = "warn"
used_underscore_binding = "warn"
